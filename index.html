<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📇</text></svg>">
</head>
<body data-auth="loading">
  <header class="topbar">
    <a class="brand" href="#" data-view="today">Customer Book</a>
    <nav class="tabs" aria-label="Main">
      <button data-view="today">Today</button>
      <button data-view="contacts">Contacts</button>
      <button data-view="deals">Deals</button>
    </nav>
    <div class="account">
      <span id="who"></span>
      <button class="btn ghost small" id="signout">Sign out</button>
    </div>
  </header>

  <main id="main"><p class="loading">Loading…</p></main>

  <dialog id="dlg"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
